<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>고객 지원</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 420px;
      width: 90%;
      text-align: center;
      box-shadow: 0 2px 20px rgba(0,0,0,0.08);
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 12px;
    }
    p {
      font-size: 15px;
      color: #666;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .email {
      display: inline-block;
      font-size: 16px;
      font-weight: 600;
      color: #1a1a1a;
      background: #f5f5f7;
      padding: 14px 24px;
      border-radius: 12px;
      letter-spacing: 0.2px;
      user-select: all;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>고객 지원</h1>
    <p>문의 사항이 있으시면<br>아래 이메일로 연락해 주세요.</p>
    <span class="email">doggguggu@gmail.com</span>
  </div>
</body>
</html>
